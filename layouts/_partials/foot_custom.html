<!-- ===== Typst 专业语言包 (使用 WASM 解析) ===== -->
<script id="typst-hljs" src="https://cdn.jsdelivr.net/npm/@myriaddreamin/highlighter-typst@0.7.0-rc2/dist/cjs/contrib/hljs/typst.bundle.js"></script>
<script>
  // 等待 WASM 解析器模块加载完成后，注册 Typst 语言
  const runTypst = $typst$parserModule.then(() => {
    hljs.registerLanguage(
      'typst',
      window.hljsTypst({
        codeBlockDefaultLanguage: 'typst',
      })
    );
    // 注册完成后，重新高亮所有代码块
    hljs.highlightAll();
  });
</script>

<!-- ===== 初始化 highlight.js ===== -->
<script>
  hljs.highlightAll();
</script>
