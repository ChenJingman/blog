<!-- KaTeX 样式 -->
<link rel="stylesheet" href="//cdn.jsdelivr.net/npm/katex/dist/katex.min.css">

<!-- highlight.js 样式 -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11.9.0/styles/github.min.css">

<!-- 自定义 JetBrains Mono 字体加载策略 + 应用 -->
<style>
    /* 1. 常规字重 */
    @font-face {
      font-family: 'JetBrains Mono';
      font-style: normal;
      font-weight: 400;
      font-display: swap;
      src: local('JetBrains Mono Regular'),
           local('JetBrainsMono-Regular'),
           url('https://cdn.jsdelivr.net/npm/jetbrains-mono@1.0.6/fonts/webfonts/JetBrainsMono-Regular.woff2') format('woff2');
    }
  
    /* 2. 粗体 */
    @font-face {
      font-family: 'JetBrains Mono';
      font-style: normal;
      font-weight: 700;
      font-display: swap;
      src: local('JetBrains Mono Bold'),
           local('JetBrainsMono-Bold'),
           url('https://cdn.jsdelivr.net/npm/jetbrains-mono@1.0.6/fonts/webfonts/JetBrainsMono-Bold.woff2') format('woff2');
    }
  
    /* 3. 斜体（如果有需要） */
    @font-face {
      font-family: 'JetBrains Mono';
      font-style: italic;
      font-weight: 400;
      font-display: swap;
      src: local('JetBrains Mono Italic'),
           local('JetBrainsMono-Italic'),
           url('https://cdn.jsdelivr.net/npm/jetbrains-mono@1.0.6/fonts/webfonts/JetBrainsMono-Italic.woff2') format('woff2');
    }
  </style>

<!-- 自定义字体覆盖 -->
<style>
    code, pre, .hljs {
      font-family: "JetBrains Mono", monospace !important;
    }
  </style>
