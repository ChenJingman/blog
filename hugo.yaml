baseurl: "https://chenjingman.github.io/"
languageCode: "zh-cn"
title: "静塔"
theme: "hugo-xmin"
#googleAnalytics: ""
#disqusShortname: ""
footnotereturnlinkcontents: "↩"

permalinks:
  post: "/post/:year/:month/:day/:filename/"

menu:
  main:
    - name: 探索的入口
      url: "about/"
      weight: 1
    - name: 仓库
      url: "post/"
      weight: 2
    - name: 邮递特快
      url: "index.xml"

params:
  description: "最爱湖东行不足，绿杨阴里白沙堤"
  footer: "&copy; 陈静满 2026 -- {Year}"

taxonomies:
  category: categories
  tag: tags
  genre: genres
  author: authors

markup:
  highlight:
    codeFences: false #不用 Hugo 内置代码高亮，留给 highlight.js
  goldmark:
    renderer:
      unsafe: true #允许 Markdown 里直接写 HTML
    extensions:
      passthrough: #KaTeX
        enable: true
        delimiters:
          block:
          - - \[
            - \]
          - - $$
            - $$
          inline:
          - - \(
            - \)
      cjk:
        eastAsianLineBreaks: true
        eastAsianLineBreaksStyle: simple
      typographer: false
