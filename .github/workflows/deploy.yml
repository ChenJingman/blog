name: Deploy Hugo to xxx.github.io

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      # 检出源码仓库
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      
      # 设置 Hugo
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: 'latest'
          extended: true
      
      # 构建站点
      - name: Build
        run: hugo --minify
      
      # 部署到 xxx.github.io 仓库
      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        with:
          # 使用自动生成的 GITHUB_TOKEN
          personal_token: ${{ secrets.GH_PAGES_TOKEN }}
          # 发布目录
          publish_dir: ./public
          # 目标仓库（替换为你的用户名）
          external_repository: chenjingman/xxx.github.io
          # 目标分支
          publish_branch: main
          # 提交信息
          commit_message: "Auto deploy from blog-source"